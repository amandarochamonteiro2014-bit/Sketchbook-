!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno de Desenho Retrô</title>
    <style>
        :root {
            --paper-color: #fdfbf7;
            --leather-color: #4a2e18;
            --leather-dark: #2c190b;
            --accent-gold: #d4af37;
            --line-color: #e3dcd0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b2b2b;
            background-image: radial-gradient(#3a3a3a 15%, transparent 16%), radial-gradient(#1a1a1a 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Capa / Caderno */
        .sketchbook {
            width: 100%;
            background-color: var(--leather-color);
            border: 4px solid var(--leather-dark);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.6);
            padding: 15px;
            position: relative;
        }

        /* Folha de Papel */
        .page {
            background-color: var(--paper-color);
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 24px;
            border: 1px solid #d0c8b8;
            border-radius: 4px;
            height: 420px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        /* Painel de Ferramentas Retrô */
        .toolbox {
            margin-top: 15px;
            background: #dcd7cc;
            border: 3px solid #7c6f5d;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.3);
        }

        .tool-btn {
            background: #f4efe6;
            border: 2px solid #5c5243;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 #5c5243;
            transition: all 0.1s ease;
        }

        .tool-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #5c5243;
        }

        .tool-btn.active {
            background: var(--leather-color);
            color: #fff;
            border-color: var(--leather-dark);
            box-shadow: 0 0 0 #2c190b;
            transform: translateY(3px);
        }

        .color-picker {
            appearance: none;
            border: 2px solid #5c5243;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .footer-note {
            margin-top: 10px;
            color: #888;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sketchbook">
            <div class="page">
                <canvas id="drawCanvas"></canvas>
            </div>
        </div>

        <div class="toolbox">
            <button class="tool-btn active" id="btnPen" onclick="setTool('pen')">Lápis</button>
            <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">Borracha</button>
            <input type="color" class="color-picker" id="colorPicker" value="#2c190b" title="Escolher Cor">
            <button class="tool-btn" onclick="clearCanvas()">Limpar</button>
        </div>
        
        <div class="footer-note">Caderno Retrô HTML5 • Use o dedo ou mouse para desenhar</div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentTool = 'pen';

        // Ajustar tamanho real do canvas para evitar distorção
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        // Funções de Desenho (Suporte a Mouse e Toque)
        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;

            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineWidth = currentTool === 'eraser' ? 20 : 3;
            ctx.strokeStyle = currentTool === 'eraser' ? '#fdfbf7' : document.getElementById('colorPicker').value;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Eventos de Mouse
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        // Eventos de Toque (Celular)
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        // Trocar ferramentas
        function setTool(tool) {
            currentTool = tool;
            document.getElementById('btnPen').classList.remove('active');
            document.getElementById('btnEraser').classList.remove('active');

            if (tool === 'pen') {
                document.getElementById('btnPen').classList.add('active');
            } else {
                document.getElementById('btnEraser').classList.add('active');
            }
        }

        // Limpar página
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
